name: 发现问题
description: 反馈安装、记账、自动识别或备份中的问题
title: "[问题] "
body:
  - type: markdown
    attributes:
      value: |
        感谢试用！这是公开反馈区，请勿提交密码、验证码、SMTP授权码、账本文件或未脱敏的交易截图。
        不需要为了测试额外付款；无法确认的信息可以填写“不清楚”。
  - type: dropdown
    id: area
    attributes:
      label: 问题发生在哪里？
      options:
        - 安装或启动
        - 手动记账、分类或日历
        - 搜索、比较或预算
        - 微信或支付宝自动记账
        - 账号、邮箱验证码或密码
        - 电脑连接、备份或换机恢复
        - 主题或页面显示
        - 其他
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 软件版本
      description: 请填写手机端版本；涉及电脑端时同时填写电脑端版本。
      placeholder: "例如：手机0.7.10，电脑0.7.0；不使用电脑端"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备与系统
      placeholder: "例如：realme GT7，Android 16；Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 操作步骤
      placeholder: "1. 打开哪个页面
2. 点击什么
3. 出现什么"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
      description: 请写出完整提示文字，并说明每次都发生还是偶尔发生。
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 自动记账问题可描述系统是否出现支付通知；备份问题可说明电脑是否在线、本次备份结果和双方版本。截图须遮盖个人信息。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 我已检查内容，不包含密码、授权码、验证码或真实账本文件，截图中的个人信息已遮盖。
          required: true
